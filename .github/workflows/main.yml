name: Deploy to GitHub Pages
on:
  push:
    branches: [ main ]     # or master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  WORKDIR: "./Hadagasma/event-planner-firebase"           # <-- change to your subfolder: ./event-planner-firebase, ./frontend, etc.

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Show structure (debug)
        run: |
          pwd
          ls -la
          ls -la $WORKDIR
      - run: npm ci
        working-directory: ${{ env.WORKDIR }}
      - run: VITE_BASE=/${{ github.event.repository.name }}/ npm run build
        working-directory: ${{ env.WORKDIR }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.WORKDIR }}/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
